# Per-provider model configuration: priority/fallback order, per-model quota table
# (rpm/tpm/rpd, -1 = unlimited), and model name aliases. Loaded once at startup by
# ProviderRegistry. Edit and restart the service to apply changes (no hot-reload in v1).
#
# quota_table numbers below are taken from the Google AI Studio console per-model
# usage page (2026-07-23), NOT guessed/uniform — a prior version of this table had
# rpd:500/rpm:15/tpm:1M copy-pasted across every model, which let the gateway
# over-dispatch past several models' real (much lower) daily caps and only find out
# via a real 429 from Google. gemini-2.5-flash was removed (moved to paid tier,
# unusable on these free-tier keys). gemini-3.1-flash-preview was removed: confirmed
# 0/33 real calls succeeding, Google returning "404 models/gemini-3.1-flash-preview is
# not found for API version v1beta" — it doesn't exist for this key pool, and it's
# absent from the console's model list entirely. gemini-2.5-flash-lite removed
# 2026-07-23 (outdated generation, superseded by the 3.x flash-lite models).
# gemini-3.1-flash-lite-preview renamed to gemini-3.1-flash-lite same day (2026-07-23:
# every configured model, including this one under its new name, verified live via
# the running key pool's real keys — a real generateContent call succeeded).

gemini:
  model_priority:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-3-flash-preview
    - gemini-3.5-flash
    - gemini-3.6-flash
    - gemini-3.7-flash
    - gemini-3.8-flash
    - gemini-2.5-flash
    - gemini-2.5-flash-lite
  # gemini-3.1-pro-preview dropped 2026-10-17: 429 "free_tier_requests, limit: 0" on every
  # key tested. Probed the same day, also limit 0 on these free keys: gemini-4-argon,
  # gemini-omni-1.1-flash, gemini-omni-flash-preview, gemini-pro-latest; gemini-2.5-pro is 404.

  # Resolves a caller-supplied shorthand/alias to the concrete model id used for both the
  # SDK call and quota lookups.
  model_aliases:
    gemini-3.1: gemini-3.1-flash-lite
    gemini-3: gemini-3-flash-preview
    gemini-3.1-flash: gemini-3.1-flash-lite
    gemini-3-flash: gemini-3-flash-preview
    gemini-3.5: gemini-3.5-flash
    gemini-3.6: gemini-3.6-flash
    # Was gemini-2.5-flash (now paid/removed). Mirrors Google's own
    # "Flash-Lite Latest" alias, which currently points to gemini-3.5-flash-lite.
    gemini-flash-latest: gemini-3.5-flash-lite

  quota_table:
    gemini-3.1-flash-lite: {rpm: 15, tpm: 250000, rpd: 500}
    gemini-3.5-flash-lite: {rpm: 15, tpm: 250000, rpd: 500}
    gemini-3-flash-preview: {rpm: 5, tpm: 250000, rpd: 20}
    gemini-3.5-flash: {rpm: 5, tpm: 250000, rpd: 20}
    gemini-3.6-flash: {rpm: 5, tpm: 250000, rpd: 20}
    # Added 2026-10-16 from the AI Studio rate-limit page (all three free at 5 RPM / 20 RPD);
    # gemini-2.5-flash is back on the free tier, and all three ids are listed by
    # models.list on a pool key.
    gemini-3.7-flash: {rpm: 5, tpm: 250000, rpd: 20}
    gemini-3.8-flash: {rpm: 5, tpm: 250000, rpd: 20}
    gemini-2.5-flash: {rpm: 5, tpm: 250000, rpd: 20}
    # Re-added 2026-10-17 (a live call succeeded on a pool key). PLACEHOLDER quota, set
    # to the tightest flash shape until read from the AI Studio rate-limit page.
    gemini-2.5-flash-lite: {rpm: 5, tpm: 250000, rpd: 20}
    # PLACEHOLDER quota — mirrors gemini-1.5-pro's tighter pro-tier shape (pro models
    # are typically far more rate-limited than flash on the free tier). Not visible on
    # the console's per-model usage page as of 2026-07-23 — verify and correct before
    # relying on it.
    gemini-3.1-pro-preview: {rpm: 2, tpm: 32000, rpd: 50}

  backoff:
    rate_limit_base_seconds: 30.0
    high_demand_base_seconds: 8.0
    max_backoff_seconds: 1000.0
    max_streak: 8
    jitter_fraction: 0.25

# ---- OpenAI-compatible providers (text + images only; no video/audio) ----
# Added 2026-10-24. Model ids and free-tier quota numbers are from each vendor's public
# docs as remembered, NOT yet verified against a live key — check the console rate-limit
# page and run one real call per model before relying on them (same lesson as the Gemini
# table above). `vision_models` lists the models that accept image input; an image sent to
# any other model is refused before the HTTP call. Video/audio is always refused, so
# Instagram-style video jobs must keep using provider "gemini".

groq:
  model_priority:
    - openai/gpt-oss-120b
    - openai/gpt-oss-20b
    - llama-3.3-70b-versatile
    - meta-llama/llama-4-scout-17b-16e-instruct
    - llama-3.1-8b-instant
  vision_models:
    - meta-llama/llama-4-scout-17b-16e-instruct
  model_aliases:
    gpt-oss-120b: openai/gpt-oss-120b
    gpt-oss-20b: openai/gpt-oss-20b
    llama-4-scout: meta-llama/llama-4-scout-17b-16e-instruct
  quota_table:
    openai/gpt-oss-120b: {rpm: 30, tpm: 8000, rpd: 1000}
    openai/gpt-oss-20b: {rpm: 30, tpm: 8000, rpd: 1000}
    llama-3.3-70b-versatile: {rpm: 30, tpm: 12000, rpd: 1000}
    meta-llama/llama-4-scout-17b-16e-instruct: {rpm: 30, tpm: 30000, rpd: 1000}
    llama-3.1-8b-instant: {rpm: 30, tpm: 6000, rpd: 14400}

cerebras:
  model_priority:
    - gpt-oss-120b
    - qwen-3-235b-a22b-instruct-2507
    - llama3.1-8b
  model_aliases:
    qwen-3-235b: qwen-3-235b-a22b-instruct-2507
  quota_table:
    gpt-oss-120b: {rpm: 30, tpm: 60000, rpd: 14400}
    qwen-3-235b-a22b-instruct-2507: {rpm: 30, tpm: 60000, rpd: 14400}
    llama3.1-8b: {rpm: 30, tpm: 60000, rpd: 14400}

mistral:
  model_priority:
    - mistral-small-latest
    - mistral-medium-latest
    - mistral-large-latest
  vision_models:
    - mistral-small-latest
    - mistral-medium-latest
    - mistral-large-latest
  model_aliases:
    mistral-small: mistral-small-latest
    mistral-medium: mistral-medium-latest
    mistral-large: mistral-large-latest
  # Experiment (free) plan is limited per-minute and by a big monthly token budget, not
  # per-day, hence rpd -1.
  quota_table:
    mistral-small-latest: {rpm: 2, tpm: 500000, rpd: -1}
    mistral-medium-latest: {rpm: 2, tpm: 500000, rpd: -1}
    mistral-large-latest: {rpm: 2, tpm: 500000, rpd: -1}

# OpenRouter exposes automatically selected free models using openrouter/free. Its free
# API keys are limited to 20 RPM and 50 requests/day (per account). Keep one key unless
# keys belong to separate accounts; rotating keys from one account does not add quota.
openrouter:
  model_priority:
    - openrouter/free
  vision_models:
    - openrouter/free
  model_aliases:
    free: openrouter/free
  quota_table:
    openrouter/free: {rpm: 20, tpm: -1, rpd: 50}

# NVIDIA NIM (build.nvidia.com), added 2026-10-31. Free dev tier is ~40 RPM per account
# with no published daily cap (unverified; credit-based and can change). Model ids below
# each returned a real 200 completion on a live key on 2026-10-31. The /v1/models catalog
# lists ~85 ids but many 404 per-account ("Function ... Not found for account"):
# nemotron-3-super-120b-a12b, kimi-k2.6 and cosmos-reason2-8b did. deepseek-v4.1-flash and
# glm-5.3-flash timed out at 60s and are untested, as are llama-3.2-90b-vision-instruct and
# gemma-4-31b-it. Latency varies a lot on the free tier (gpt-oss-20b took ~44s for "pong").
# The two nemotron VL/omni models also accepted a small base64 video directly against the
# NVIDIA API, but this gateway still refuses video for every OpenAI-compatible provider.
nvidia:
  # Ordered fastest-first from live "pong" probes on 2026-10-31 (seconds in brackets).
  # Also returned 200 but left out as too slow/low value: meta/muse-glimmer-30b [85s],
  # poolside/laguna-xs-2.1 [19s]. Per-account 404s and 100s timeouts: see note above.
  model_priority:
    - nvidia/nemotron-3.5-bolt-e4b                   # [1.1s]
    - nvidia/nemotron-3-ultra-550b-a55b              # [1.4s]
    - nvidia/nemotron-3.5-lightning-30b-a3b          # [3.3s]
    - nvidia/nemotron-3.5-super-vl-120b-a12b         # [6.8s] vision/video-capable
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning  # [8.5s] vision/video-capable
    - mistralai/mistral-large-4-1t-a52b              # [12s]
    - openai/gpt-oss-20b                             # [44s]
  vision_models:
    - nvidia/nemotron-3.5-super-vl-120b-a12b
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  model_aliases:
    nemotron-bolt: nvidia/nemotron-3.5-bolt-e4b
    nemotron-ultra: nvidia/nemotron-3-ultra-550b-a55b
    nemotron-lightning: nvidia/nemotron-3.5-lightning-30b-a3b
    nemotron-vl: nvidia/nemotron-3.5-super-vl-120b-a12b
    nemotron-omni: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    mistral-large-4: mistralai/mistral-large-4-1t-a52b
    gpt-oss-20b: openai/gpt-oss-20b
  quota_table:
    nvidia/nemotron-3.5-bolt-e4b: {rpm: 40, tpm: -1, rpd: -1}
    nvidia/nemotron-3-ultra-550b-a55b: {rpm: 40, tpm: -1, rpd: -1}
    nvidia/nemotron-3.5-lightning-30b-a3b: {rpm: 40, tpm: -1, rpd: -1}
    nvidia/nemotron-3.5-super-vl-120b-a12b: {rpm: 40, tpm: -1, rpd: -1}
    nvidia/nemotron-3-nano-omni-30b-a3b-reasoning: {rpm: 40, tpm: -1, rpd: -1}
    mistralai/mistral-large-4-1t-a52b: {rpm: 40, tpm: -1, rpd: -1}
    openai/gpt-oss-20b: {rpm: 40, tpm: -1, rpd: -1}

# Z.ai (api.z.ai, international Zhipu), added 2026-10-31. Key env var: Z_AI_API_KEYS.
# Only the free "flash" ids work without paid balance; every other id /models lists
# (glm-4.5/4.6/4.7, glm-5.x incl. glm-5.3-flash) returned 429 code 1113 "Insufficient
# balance" on a live free key, so they're deliberately left out. glm-4.7-flash returned
# 429 code 1305 "overloaded" at probe time — free, just busy, so it's kept last.
# Free-tier rate limits are not published per model; the numbers below are a guess.
zai:
  model_priority:
    - glm-4.6v-flash   # [2.4s] vision-capable (text-only verified)
    - glm-4.5-flash    # [5.8s]
    - glm-4.7-flash    # overloaded at probe time
  vision_models:
    - glm-4.6v-flash
  model_aliases: {}
  quota_table:
    glm-4.6v-flash: {rpm: 10, tpm: -1, rpd: -1}
    glm-4.5-flash: {rpm: 10, tpm: -1, rpd: -1}
    glm-4.7-flash: {rpm: 10, tpm: -1, rpd: -1}

cloudflare:
  model_priority:
    - '@cf/google/gemma-4-26b-a4b-it'
    - '@cf/zai-org/glm-4.7-flash'
    - '@cf/nvidia/nemotron-3-120b-a12b'
  vision_models:
    - '@cf/google/gemma-4-26b-a4b-it'
  model_aliases:
    gemma-4: '@cf/google/gemma-4-26b-a4b-it'
    glm-flash: '@cf/zai-org/glm-4.7-flash'
    nemotron-3: '@cf/nvidia/nemotron-3-120b-a12b'
  quota_table:
    '@cf/google/gemma-4-26b-a4b-it': {rpm: -1, tpm: -1, rpd: -1}
    '@cf/zai-org/glm-4.7-flash': {rpm: -1, tpm: -1, rpd: -1}
    '@cf/nvidia/nemotron-3-120b-a12b': {rpm: -1, tpm: -1, rpd: -1}
